<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kassir — Oshxona</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    color: #f1f5f9;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .screen { width: 100%; max-width: 480px; padding: 24px; }
  h1 { font-size: 1.4rem; margin-bottom: 16px; text-align: center; }
  input[type="password"], input[type="text"] {
    width: 100%;
    font-size: 1.1rem;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #f1f5f9;
    margin-bottom: 12px;
  }
  button {
    width: 100%;
    font-size: 1.1rem;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: #2563eb;
    color: white;
    cursor: pointer;
  }
  button:active { background: #1d4ed8; }
  .error { color: #f87171; min-height: 1.2em; margin-top: 8px; text-align: center; }
  .hidden { display: none !important; }
  #offlineBadge {
    background: #78350f;
    color: #fde68a;
    padding: 8px 12px;
    border-radius: 8px;
    text-align: center;
    margin-bottom: 12px;
    font-size: 0.9rem;
  }
  #result {
    margin-top: 20px;
    padding: 24px;
    border-radius: 16px;
    text-align: center;
    min-height: 160px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  #result.ok { background: #052e16; border: 2px solid #22c55e; }
  #result.fail { background: #2e0505; border: 2px solid #ef4444; }
  #result .message { font-size: 1.6rem; font-weight: 700; }
  #result .name { font-size: 1.2rem; }
  #result .photo {
    width: 140px;
    height: 140px;
    object-fit: cover;
    border-radius: 12px;
    margin-top: 8px;
  }
  #codeInput { text-align: center; font-size: 1.3rem; }
  .pinBox {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid #334155;
  }
  .pinBox h2 { font-size: 1rem; color: #94a3b8; margin: 0 0 10px; text-align: center; font-weight: 600; }
  #pinInput { text-align: center; font-size: 1.3rem; letter-spacing: 6px; }
  .secondaryBtn { background: #334155; }
  .secondaryBtn:active { background: #1e293b; }
</style>
</head>
<body>

  <div id="loginScreen" class="screen">
    <h1>🔑 Kassir kirishi</h1>
    <input type="password" id="tokenInput" placeholder="Kassa tokenini kiriting" autocomplete="off" />
    <button id="loginBtn">Kirish</button>
    <p class="error" id="loginError"></p>
  </div>

  <div id="scanScreen" class="screen hidden">
    <div id="offlineBadge" class="hidden">📴 Oflayn — navbatda: <span id="queueCount">0</span> ta kod</div>
    <h1>🍽 QR kodni skanerlang</h1>
    <input type="text" id="codeInput" autocomplete="off" placeholder="Kod shu yerga tushadi..." />
    <div id="result"></div>

    <div class="pinBox">
      <h2>🆘 Favqulodda PIN</h2>
      <input
        type="text"
        id="pinInput"
        inputmode="numeric"
        autocomplete="off"
        maxlength="4"
        placeholder="0000"
      />
      <button id="pinBtn" class="secondaryBtn">PIN orqali kiritish</button>
    </div>
  </div>

<script src="/kassir.js"></script>
</body>
</html>
